version: "3.9"

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: food-api-gateway:latest
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user-service:3001
      - ORDER_SERVICE_URL=http://order-service:3002
      - PAYMENT_SERVICE_URL=http://payment-service:3003
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - order-service
      - payment-service

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    image: food-user-service:latest
    environment:
      - PORT=3001
      - DB_HOST=user-db
      - DB_PORT=5432
      - DB_NAME=user_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=dev_secret_for_local
    depends_on:
      - user-db

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    image: food-order-service:latest
    environment:
      - PORT=3002
      - DB_HOST=order-db
      - DB_PORT=5432
      - DB_NAME=order_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PAYMENT_SERVICE_URL=http://payment-service:3003
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - order-db
      - rabbitmq

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    image: food-payment-service:latest
    environment:
      - PORT=3003
      - DB_HOST=payment-db
      - DB_PORT=5432
      - DB_NAME=payment_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - payment-db
      - rabbitmq

  user-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=user_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    volumes:
      - ./services/user-service/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  order-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=order_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5435:5432"
    volumes:
      - ./services/order-service/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  payment-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=payment_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5436:5432"
    volumes:
      - ./services/payment-service/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
